<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
        --focus-ring: var(--figma-color-border-selected, var(--figma-color-border-brand));
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font: 11px/16px Inter, system-ui, sans-serif;
        background: var(--figma-color-bg);
        color: var(--figma-color-text);
      }
      html,
      body {
        overflow: hidden;
      }
      .wrap {
        padding: 8px 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .muted {
        color: var(--figma-color-text-secondary);
      }
      label,
      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 11px;
        line-height: 16px;
        font-weight: 500;
        color: var(--figma-color-text-secondary);
      }
      .expr-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 16px;
      }
      .expr-label {
        font-size: 11px;
        line-height: 16px;
        font-weight: 500;
      }
      .expr-label .mode-on {
        color: var(--figma-color-text);
      }
      .expr-label .mode-off {
        color: var(--figma-color-text-secondary);
      }
      input,
      select {
        height: 28px;
        padding: 0 8px;
        border: 1px solid var(--figma-color-border);
        border-radius: 4px;
        background: var(--figma-color-bg);
        color: var(--figma-color-text);
        font: 11px/16px Inter, system-ui, sans-serif;
        font-weight: 400;
      }
      input:hover:not(:focus),
      select:hover:not(:focus) {
        border-color: var(--figma-color-border-strong, var(--figma-color-border));
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: var(--focus-ring);
        box-shadow: 0 0 0 1px var(--focus-ring);
      }
      .formula-box {
        min-height: 100px;
        height: auto;
        padding: 6px 8px;
        border: 1px solid var(--figma-color-border);
        border-radius: 4px;
        background: var(--figma-color-bg);
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        align-content: flex-start;
        gap: 4px 0;
        cursor: text;
        width: 100%;
      }
      .formula-box:hover:not(:focus-within):not(.is-picking) {
        border-color: var(--figma-color-border-strong, var(--figma-color-border));
      }
      .clear-expr {
        height: auto;
        padding: 0 2px 0 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--figma-color-text-secondary);
        font-size: 11px;
        font-weight: 400;
        line-height: 16px;
        flex-shrink: 0;
        opacity: 0.72;
      }
      .clear-expr:hover {
        background: transparent;
        color: var(--figma-color-text);
        opacity: 1;
        text-decoration: underline;
      }
      .formula-box:focus-within,
      .formula-box.is-picking {
        outline: none;
        border-color: var(--focus-ring);
        box-shadow: 0 0 0 1px var(--focus-ring);
      }
      .formula-box.is-error {
        border-color: var(--figma-color-border-danger, #f24822);
      }
      .formula-box.is-error:focus-within,
      .formula-box.is-error.is-picking {
        border-color: var(--figma-color-border-danger, #f24822);
        box-shadow: 0 0 0 1px var(--figma-color-border-danger, #f24822);
      }
      .equals {
        font-weight: 600;
        font-size: 11px;
        line-height: 20px;
        color: var(--figma-color-bg-brand);
        padding: 0 4px 0 2px;
        cursor: text;
        flex-shrink: 0;
      }
      #formulaTokens {
        display: contents;
      }
      .token-run {
        display: inline-flex;
        flex-wrap: nowrap;
        align-items: center;
        max-width: 100%;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 20px;
        padding: 0 2px 0 6px;
        border-radius: 4px;
        background: var(--figma-color-bg-brand);
        color: var(--figma-color-text-onbrand);
        font-weight: 500;
        font-size: 11px;
        line-height: 16px;
        user-select: none;
        cursor: default;
      }
      .tag-label {
        pointer-events: none;
      }
      .tag-remove {
        height: 16px;
        width: 16px;
        min-width: 16px;
        padding: 0;
        border: 0;
        border-radius: 2px;
        background: transparent;
        color: inherit;
        font-size: 11px;
        line-height: 1;
        cursor: pointer;
        flex-shrink: 0;
      }
      .tag-remove:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .op {
        color: var(--figma-color-text-tertiary, var(--figma-color-text-secondary));
        font-weight: 500;
        font-size: 11px;
        line-height: 20px;
        padding: 0 3px;
        cursor: text;
        user-select: none;
        border-radius: 2px;
      }
      .op:hover {
        background: var(--figma-color-bg-tertiary, rgba(0, 0, 0, 0.06));
      }
      .slot {
        width: 8px;
        min-height: 20px;
        flex-shrink: 0;
        cursor: text;
        border-radius: 2px;
        align-self: stretch;
      }
      .slot:hover {
        background: var(--figma-color-bg-brand);
        opacity: 0.28;
      }
      #exprDraft {
        flex: 1 1 64px;
        min-width: 48px;
        height: 20px;
        padding: 0 2px;
        border: 0;
        background: transparent;
        outline: none;
        box-shadow: none;
        font-size: 11px;
        line-height: 16px;
        caret-color: var(--figma-color-text);
      }
      #exprDraft:focus {
        outline: none;
        border: 0;
        box-shadow: none;
      }
      #exprDraft.is-mid {
        flex: 0 1 auto;
        min-width: 8px;
        width: 8px;
        caret-color: var(--figma-color-text);
        background: transparent;
      }
      #exprDraft.is-mid:not(:placeholder-shown) {
        min-width: 24px;
        width: auto;
      }
      #exprDraft::placeholder {
        color: var(--figma-color-text-tertiary, var(--figma-color-text-secondary));
        opacity: 0.85;
      }
      .format-row {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 8px;
      }
      button {
        height: 32px;
        border: 0;
        border-radius: 6px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .expr-error {
        font-weight: 400;
        font-size: 11px;
        line-height: 16px;
        color: var(--figma-color-text-danger, #f24822);
        padding: 0 1px;
      }
      .more {
        margin: 0;
      }
      .more summary {
        display: flex;
        align-items: center;
        gap: 4px;
        width: 100%;
        margin: 0;
        padding: 0 2px;
        cursor: pointer;
        color: var(--figma-color-text-secondary);
        font-size: 11px;
        line-height: 16px;
        font-weight: 500;
        list-style: none;
        border-radius: 2px;
        user-select: none;
      }
      .more summary::-webkit-details-marker {
        display: none;
      }
      .more summary:hover {
        color: var(--figma-color-text);
      }
      .more .chevron {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        border-radius: 2px;
        font-size: 11px;
        line-height: 1;
        transform: rotate(0deg);
        transition: transform 0.12s ease, background 0.12s ease;
      }
      .more summary:hover .chevron {
        background: var(--figma-color-bg-hover, var(--figma-color-bg-tertiary, rgba(255, 255, 255, 0.08)));
      }
      .more[open] .chevron {
        transform: rotate(90deg);
      }
      .more .stack {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 8px;
      }
      .empty {
        padding: 32px 16px 24px;
        text-align: center;
        color: var(--figma-color-text-secondary);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .empty svg {
        width: 160px;
        height: auto;
        opacity: 0.95;
      }
      .empty p {
        margin: 0;
        max-width: 220px;
        font-size: 11px;
        line-height: 16px;
      }
      .format-only-banner {
        font-size: 11px;
        line-height: 16px;
        font-weight: 600;
        color: var(--figma-color-text);
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="empty" class="empty">
      <svg viewBox="0 0 200 140" fill="none" aria-hidden="true">
        <rect x="28" y="18" width="144" height="104" rx="12" fill="var(--figma-color-bg-secondary)" stroke="var(--figma-color-border)" />
        <rect x="44" y="36" width="72" height="10" rx="3" fill="var(--figma-color-bg-tertiary, #3a3a3a)" />
        <rect x="44" y="54" width="96" height="10" rx="3" fill="var(--figma-color-bg-brand)" opacity="0.85" />
        <rect x="44" y="72" width="56" height="10" rx="3" fill="var(--figma-color-bg-tertiary, #3a3a3a)" />
        <rect x="44" y="90" width="80" height="10" rx="3" fill="var(--figma-color-bg-tertiary, #3a3a3a)" />
        <g transform="translate(116 56)">
          <path
            fill="#fff"
            stroke="#000"
            stroke-width="2.25"
            stroke-linejoin="round"
            stroke-linecap="round"
            d="M5 4v27.5l7.2-6.4 5.3 10.8 5.5-2.1-5.3-10.8 10.8-.4z"
          />
        </g>
      </svg>
      <p>Select a text layer to set<br /> a formula or format.</p>
    </div>
    <form id="panel" class="wrap" hidden>
      <p class="format-only-banner" id="formatOnlyBanner" hidden></p>
      <input id="cellId" type="hidden" />
      <div id="exprSection" class="field">
        <div class="expr-head">
          <span class="expr-label">
            <span id="modeFormula" class="mode-off">Formula</span>
            <span class="mode-off"> or </span>
            <span id="modeValue" class="mode-on">value</span>
          </span>
          <button type="button" id="clearExpr" class="clear-expr" hidden>Clear</button>
        </div>
        <div class="formula-box" id="exprBox">
          <span id="equalsMark" class="equals" hidden>=</span>
          <div id="formulaTokens"></div>
          <input id="exprDraft" placeholder="Type a value or select layers…" spellcheck="false" />
        </div>
        <span class="expr-error" id="exprError" hidden></span>
      </div>
      <div class="format-row">
        <label>
          Format
          <select id="kind">
            <option value="number">Number</option>
            <option value="percent">Percent</option>
            <option value="currency">Currency</option>
            <option value="compact">Compact</option>
          </select>
        </label>
        <label>
          Digits
          <select id="fractionDigits">
            <option value="">Auto</option>
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </label>
      </div>
      <details class="more" id="moreOptions">
        <summary>
          <span class="chevron" aria-hidden="true">›</span>
          Locale &amp; formatting
        </summary>
        <div class="stack">
          <label id="currencyField">
            Currency
            <select id="currency"></select>
          </label>
          <label id="localeField">
            Locale
            <select id="locale"></select>
          </label>
        </div>
      </details>
    </form>
    <script>
      const FN = new Set(["SUM", "AVG", "MIN", "MAX"]);
      const CURRENCIES = [
        ["USD", "🇺🇸 US Dollar"],
        ["EUR", "🇪🇺 Euro"],
        ["GBP", "🇬🇧 British Pound"],
        ["JPY", "🇯🇵 Japanese Yen"],
        ["CNY", "🇨🇳 Chinese Yuan"],
        ["KRW", "🇰🇷 South Korean Won"],
        ["CAD", "🇨🇦 Canadian Dollar"],
        ["AUD", "🇦🇺 Australian Dollar"],
        ["CHF", "🇨🇭 Swiss Franc"],
        ["INR", "🇮🇳 Indian Rupee"],
        ["MXN", "🇲🇽 Mexican Peso"],
        ["BRL", "🇧🇷 Brazilian Real"],
        ["SEK", "🇸🇪 Swedish Krona"],
        ["NOK", "🇳🇴 Norwegian Krone"],
        ["DKK", "🇩🇰 Danish Krone"],
        ["SGD", "🇸🇬 Singapore Dollar"],
        ["HKD", "🇭🇰 Hong Kong Dollar"],
        ["NZD", "🇳🇿 New Zealand Dollar"],
        ["TWD", "🇹🇼 New Taiwan Dollar"],
        ["PLN", "🇵🇱 Polish Złoty"],
      ];
      const LOCALES = [
        ["en-US", "English (United States)"],
        ["en-GB", "English (United Kingdom)"],
        ["en-CA", "English (Canada)"],
        ["en-AU", "English (Australia)"],
        ["de-DE", "German (Germany)"],
        ["fr-FR", "French (France)"],
        ["fr-CA", "French (Canada)"],
        ["es-ES", "Spanish (Spain)"],
        ["es-MX", "Spanish (Mexico)"],
        ["it-IT", "Italian (Italy)"],
        ["pt-BR", "Portuguese (Brazil)"],
        ["pt-PT", "Portuguese (Portugal)"],
        ["ja-JP", "Japanese (Japan)"],
        ["zh-CN", "Chinese (Simplified)"],
        ["zh-TW", "Chinese (Traditional)"],
        ["ko-KR", "Korean (South Korea)"],
        ["nl-NL", "Dutch (Netherlands)"],
        ["sv-SE", "Swedish (Sweden)"],
        ["nb-NO", "Norwegian (Norway)"],
        ["da-DK", "Danish (Denmark)"],
        ["fi-FI", "Finnish (Finland)"],
        ["pl-PL", "Polish (Poland)"],
        ["ru-RU", "Russian (Russia)"],
        ["tr-TR", "Turkish (Turkey)"],
        ["hi-IN", "Hindi (India)"],
        ["th-TH", "Thai (Thailand)"],
        ["vi-VN", "Vietnamese (Vietnam)"],
        ["id-ID", "Indonesian (Indonesia)"],
        ["ar-SA", "Arabic (Saudi Arabia)"],
        ["he-IL", "Hebrew (Israel)"],
      ];

      const empty = document.getElementById("empty");
      const panel = document.getElementById("panel");
      const formatOnlyBanner = document.getElementById("formatOnlyBanner");
      const exprSection = document.getElementById("exprSection");
      const cellId = document.getElementById("cellId");
      const exprBox = document.getElementById("exprBox");
      const equalsMark = document.getElementById("equalsMark");
      const formulaTokens = document.getElementById("formulaTokens");
      const exprDraft = document.getElementById("exprDraft");
      const clearExpr = document.getElementById("clearExpr");
      const modeFormula = document.getElementById("modeFormula");
      const modeValue = document.getElementById("modeValue");
      const exprError = document.getElementById("exprError");
      const kind = document.getElementById("kind");
      const fractionDigits = document.getElementById("fractionDigits");
      const currency = document.getElementById("currency");
      const locale = document.getElementById("locale");
      const moreOptions = document.getElementById("moreOptions");
      const currencyField = document.getElementById("currencyField");

      let formulaParts = [];
      let caretIndex = 0;
      let formulaMode = false;
      let formatOnly = false;
      let blurTimer = 0;
      let commitTimer = 0;
      let previewError = false;
      let holdFormulaFocus = false;
      let clearUndoArmed = false;
      let clearUndoTimer = 0;
      const CLEAR_UNDO_MS = 5000;

      for (const [code, label] of CURRENCIES) {
        const option = document.createElement("option");
        option.value = code;
        option.textContent = label;
        currency.append(option);
      }
      currency.value = "USD";
      for (const [code, label] of LOCALES) {
        const option = document.createElement("option");
        option.value = code;
        option.textContent = label;
        locale.append(option);
      }
      locale.value = "en-US";

      function post(pluginMessage) {
        parent.postMessage({ pluginMessage }, "*");
      }

      let lastPluginHeight = 0;
      function formulaFieldBusy() {
        return (
          document.activeElement === exprDraft ||
          exprBox.classList.contains("is-picking") ||
          holdFormulaFocus
        );
      }

      function resizePlugin() {
        if (formulaFieldBusy()) return;
        const visible = panel.hidden ? empty : panel;
        const height = Math.min(800, Math.max(140, Math.ceil(visible.getBoundingClientRect().bottom) + 2));
        if (height === lastPluginHeight) return;
        lastPluginHeight = height;
        post({ type: "resize", width: 320, height });
      }

      function parseParts(source) {
        const formula = source.trim().replace(/^=/, "").trim();
        if (!formula) return [];
        const re = /([A-Za-z][A-Za-z0-9_]*)|(\d+\.?\d*)|([+\-*/(),])/g;
        const parts = [];
        let match;
        while ((match = re.exec(formula))) {
          if (match[1] && !FN.has(match[1])) parts.push({ kind: "ref", value: match[1] });
          else parts.push({ kind: "text", value: match[0] });
        }
        return parts;
      }

      function joinParts(parts) {
        return parts.map((part) => part.value).join(" ").replace(/\s+/g, " ").trim();
      }

      function isBinaryOpPart(part) {
        return Boolean(part && part.kind === "text" && /^[+\-*/,]$/.test(part.value));
      }

      function isOperandPart(part) {
        if (!part) return false;
        if (part.kind === "ref") return true;
        if (isBinaryOpPart(part) || part.value === "," || part.value === ")") return false;
        return true;
      }

      function isValuePart(part) {
        if (!part) return false;
        if (part.kind === "ref") return true;
        return part.value === ")" || /^\d/.test(part.value);
      }

      function removeCellRefAt(parts, index) {
        const next = parts.slice();
        if (index < 0 || index >= next.length || next[index].kind !== "ref") return next;
        const refIndexes = next.map((part, i) => (part.kind === "ref" ? i : -1)).filter((i) => i >= 0);
        const pos = refIndexes.indexOf(index);
        const isFirst = pos === 0;
        const isLast = pos === refIndexes.length - 1;
        if (isFirst && !isLast && isBinaryOpPart(next[index + 1])) {
          next.splice(index, 2);
          return next;
        }
        if (!isLast && isBinaryOpPart(next[index - 1])) {
          next.splice(index - 1, 2);
          return next;
        }
        if (!isLast && isBinaryOpPart(next[index + 1])) {
          next.splice(index, 2);
          return next;
        }
        next.splice(index, 1);
        return next;
      }

      function insertRefIntoParts(parts, index, cellId) {
        const clamped = Math.max(0, Math.min(index, parts.length));
        const before = parts.slice(0, clamped);
        const after = parts.slice(clamped);
        const prev = before[before.length - 1];
        const nextTok = after[0];
        const out = before.slice();
        if (isValuePart(prev)) out.push({ kind: "text", value: "+" });
        out.push({ kind: "ref", value: cellId });
        const caret = out.length;
        if (isValuePart(nextTok) || (nextTok && nextTok.value === "(")) {
          out.push({ kind: "text", value: "+" });
        }
        return { parts: out.concat(after), caret };
      }

      function insertTextIntoParts(parts, index, text) {
        const next = parts.slice();
        const clamped = Math.max(0, Math.min(index, next.length));
        if (/^[+\-*/]$/.test(text)) {
          if (isBinaryOpPart(next[clamped])) {
            next[clamped] = { kind: "text", value: text };
            return { parts: next, caret: clamped + 1 };
          }
          if (clamped > 0 && isBinaryOpPart(next[clamped - 1])) {
            next[clamped - 1] = { kind: "text", value: text };
            return { parts: next, caret: clamped };
          }
        }
        next.splice(clamped, 0, { kind: "text", value: text });
        return { parts: next, caret: clamped + 1 };
      }

      function getExpression() {
        const draft = exprDraft.value.trim();
        if (!formulaMode) return draft;
        const parts = formulaParts.slice(0, caretIndex);
        if (draft) parts.push({ kind: "text", value: draft });
        parts.push(...formulaParts.slice(caretIndex));
        const body = joinParts(parts);
        return body ? `= ${body}` : "=";
      }

      function expressionFilled() {
        return getExpression().replace(/^=/, "").trim().length > 0;
      }

      function updatePlaceholder() {
        exprDraft.placeholder = expressionFilled() ? "" : "Type a value or select layers…";
      }

      function updateMode() {
        formulaMode =
          getExpression().trim().startsWith("=") ||
          (formulaMode && formulaParts.length > 0);
        equalsMark.hidden = !formulaMode;
        exprBox.classList.toggle("is-formula", formulaMode);
        modeFormula.className = formulaMode ? "mode-on" : "mode-off";
        modeValue.className = formulaMode ? "mode-off" : "mode-on";
        exprDraft.classList.toggle("is-mid", formulaMode && caretIndex < formulaParts.length);
        updatePlaceholder();
        syncClearButton();
      }

      function parkDraft() {
        if (exprDraft.parentElement !== exprBox) {
          exprBox.append(exprDraft);
        }
      }

      function setCaret(index, options = {}) {
        caretIndex = Math.max(0, Math.min(index, formulaParts.length));
        paintTokens();
        if (options.focus !== false) exprDraft.focus();
      }

      function exitFormulaMode() {
        formulaMode = false;
        formulaParts = [];
        caretIndex = 0;
        exprDraft.remove();
        formulaTokens.replaceChildren();
        parkDraft();
        updateMode();
      }

      function paintTokens() {
        if (!formulaMode) {
          parkDraft();
          formulaTokens.replaceChildren();
          updateMode();
          return;
        }
        const keepFocus = document.activeElement === exprDraft;
        exprDraft.remove();
        formulaTokens.replaceChildren();
        const emitCaret = (index) => {
          if (index === caretIndex) formulaTokens.append(exprDraft);
          else formulaTokens.append(makeSlot(index));
        };
        emitCaret(0);
        let i = 0;
        while (i < formulaParts.length) {
          const part = formulaParts[i];
          const next = formulaParts[i + 1];
          if (isBinaryOpPart(part) && isOperandPart(next)) {
            const run = document.createElement("span");
            run.className = "token-run";
            run.append(makeOp(part, i));
            i += 1;
            if (i === caretIndex) run.append(exprDraft);
            else run.append(makeSlot(i));
            run.append(next.kind === "ref" ? makeTag(next, i) : makeOp(next, i));
            formulaTokens.append(run);
            i += 1;
            emitCaret(i);
            continue;
          }
          formulaTokens.append(part.kind === "ref" ? makeTag(part, i) : makeOp(part, i));
          i += 1;
          emitCaret(i);
        }
        updateMode();
        if (keepFocus) exprDraft.focus();
      }

      function makeSlot(index) {
        const slot = document.createElement("span");
        slot.className = "slot";
        slot.addEventListener("mousedown", (event) => {
          event.preventDefault();
          event.stopPropagation();
          flushDraft();
          setCaret(index);
        });
        return slot;
      }

      function makeOp(part, index) {
        const op = document.createElement("span");
        op.className = "op";
        op.textContent = part.value;
        op.addEventListener("mousedown", (event) => {
          event.preventDefault();
          event.stopPropagation();
          flushDraft();
          setCaret(index + 1);
        });
        return op;
      }

      function makeTag(part, index) {
        const tag = document.createElement("span");
        tag.className = "tag";
        const label = document.createElement("span");
        label.className = "tag-label";
        label.textContent = part.value;
        tag.append(label);
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "tag-remove";
        remove.setAttribute("aria-label", `Remove ${part.value}`);
        remove.textContent = "×";
        remove.addEventListener("mousedown", (event) => {
          event.preventDefault();
          event.stopPropagation();
        });
        remove.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          formulaParts = removeCellRefAt(formulaParts, index);
          caretIndex = Math.min(index, formulaParts.length);
          paintTokens();
          requestPreview({ revealError: false });
          exprDraft.focus();
        });
        tag.addEventListener("mousedown", (event) => {
          if (event.target.closest(".tag-remove")) return;
          event.preventDefault();
          event.stopPropagation();
        });
        tag.addEventListener("click", (event) => {
          if (event.target.closest(".tag-remove")) return;
          event.preventDefault();
          event.stopPropagation();
          setCaret(index + 1);
        });
        tag.append(remove);
        return tag;
      }

      function renderTokens(source, caret) {
        formulaParts = parseParts(source);
        caretIndex = caret == null ? formulaParts.length : Math.min(caret, formulaParts.length);
        formulaMode = true;
        paintTokens();
      }

      function flushDraft() {
        const draft = exprDraft.value.trim();
        if (!draft || !formulaMode) return;
        const flushed = parseParts(draft);
        if (flushed.length === 0) {
          formulaParts.splice(caretIndex, 0, { kind: "text", value: draft });
          caretIndex += 1;
        } else {
          formulaParts.splice(caretIndex, 0, ...flushed);
          caretIndex += flushed.length;
        }
        exprDraft.value = "";
      }

      function insertRefAtCaret(cellId) {
        const inserted = insertRefIntoParts(formulaParts, caretIndex, cellId);
        formulaParts = inserted.parts;
        caretIndex = inserted.caret;
        exprDraft.value = "";
        formulaMode = true;
        paintTokens();
      }

      function insertTokenAtCaret(text) {
        flushDraft();
        const inserted = insertTextIntoParts(formulaParts, caretIndex, text);
        formulaParts = inserted.parts;
        caretIndex = inserted.caret;
        paintTokens();
      }

      function isCellIdDraft(text) {
        return /^[A-Za-z][A-Za-z0-9_]*$/.test(text) && !FN.has(text);
      }

      function commitDraftAsTokens(draft) {
        if (isCellIdDraft(draft)) {
          insertRefAtCaret(draft);
          return;
        }
        exprDraft.value = draft;
        flushDraft();
        paintTokens();
      }

      function consumeLeadingOps() {
        const value = exprDraft.value;
        let i = 0;
        while (i < value.length && "+-*/(),".includes(value[i])) i += 1;
        if (i === 0) return;
        const ops = value.slice(0, i);
        exprDraft.value = value.slice(i);
        for (const ch of ops) {
          const inserted = insertTextIntoParts(formulaParts, caretIndex, ch);
          formulaParts = inserted.parts;
          caretIndex = inserted.caret;
        }
        paintTokens();
      }

      function commitSpacedDraft() {
        const value = exprDraft.value;
        if (!/\s/.test(value)) return;
        const draft = value.trim();
        exprDraft.value = "";
        if (draft) commitDraftAsTokens(draft);
      }

      function ensureSelectValue(select, value) {
        if (!value) return;
        if (![...select.options].some((option) => option.value === value)) {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = value;
          select.append(option);
        }
        select.value = value;
      }

      function currentFormat() {
        const format = {
          kind: kind.value || "number",
          locale: locale.value || "en-US",
        };
        if (fractionDigits.value !== "") {
          format.fractionDigits = Math.min(5, Math.max(0, Number(fractionDigits.value)));
        }
        if (format.kind === "currency") format.currency = currency.value || "USD";
        return format;
      }

      function syncAdvancedFormatFields() {
        currencyField.hidden = kind.value !== "currency";
      }

      function payload(extra = {}) {
        const expression = getExpression();
        const isFormula = expression.trim().startsWith("=");
        return {
          cellId: cellId.value,
          formula: isFormula ? expression : "",
          rawValue: isFormula ? "" : expression,
          format: currentFormat(),
          ...extra,
        };
      }

      function requestPreview(options = {}) {
        post({ type: "preview", ...payload(), ...options });
      }

      function commitFormula() {
        window.clearTimeout(commitTimer);
        if (formatOnly) {
          post({ type: "apply-format", format: currentFormat(), silent: true });
          return;
        }
        requestPreview({ commit: true, revealError: true, silent: true });
      }

      function scheduleFormatCommit() {
        window.clearTimeout(commitTimer);
        commitTimer = window.setTimeout(() => {
          post({ type: "apply-format", format: currentFormat(), silent: true });
        }, 350);
      }

      let formulaFocusPosted = false;
      function setFormulaFocus(active) {
        exprBox.classList.toggle("is-picking", active);
        if (formulaFocusPosted === active) return;
        formulaFocusPosted = active;
        post({ type: "formula-focus", active });
      }

      function keepFormulaFieldFocused() {
        window.clearTimeout(blurTimer);
        holdFormulaFocus = true;
        exprBox.classList.add("is-picking");
        exprDraft.focus();
        setFormulaFocus(true);
        window.setTimeout(() => {
          holdFormulaFocus = false;
        }, 500);
      }

      function syncClearButton() {
        clearExpr.hidden = formatOnly || !expressionFilled();
      }

      function disarmClearUndo() {
        clearUndoArmed = false;
        window.clearTimeout(clearUndoTimer);
      }

      function armClearUndo() {
        clearUndoArmed = true;
        window.clearTimeout(clearUndoTimer);
        clearUndoTimer = window.setTimeout(disarmClearUndo, CLEAR_UNDO_MS);
      }

      function clearExpression() {
        if (!expressionFilled()) return;
        window.clearTimeout(commitTimer);
        window.clearTimeout(blurTimer);
        hideFormulaError();
        post({ type: "clear-formula" });
        armClearUndo();
      }

      function setFormat(format) {
        kind.value = format?.kind ?? "number";
        ensureSelectValue(locale, format?.locale ?? "en-US");
        ensureSelectValue(currency, format?.currency ?? "USD");
        const digits = format?.fractionDigits;
        fractionDigits.value =
          digits === undefined ? "" : String(Math.min(5, Math.max(0, digits)));
        syncAdvancedFormatFields();
      }

      function friendlyError(msg) {
        if (msg.errorMessage) return msg.errorMessage;
        if (msg.errorKind === "CYCLE") return "Circular reference";
        if (msg.errorKind === "REF") return "Unknown reference";
        return msg.formatted || msg.message || "Invalid formula";
      }

      function showFormulaError(text) {
        exprBox.classList.add("is-error");
        exprError.hidden = false;
        exprError.textContent = text || "Invalid formula";
      }

      function hideFormulaError() {
        exprBox.classList.remove("is-error");
        exprError.hidden = true;
        exprError.textContent = "";
      }

      function setPanelMode(mode, frameCount) {
        formatOnly = mode === "format-only";
        formatOnlyBanner.hidden = !formatOnly;
        formatOnlyBanner.textContent = formatOnly
          ? `Formatting ${frameCount} frames`
          : "";
        exprSection.hidden = formatOnly;
        syncClearButton();
      }

      onmessage = (event) => {
        const msg = event.data.pluginMessage;
        if (!msg) return;
        if (msg.type === "error") {
          disarmClearUndo();
          showFormulaError(friendlyError(msg));
          return;
        }
        if (msg.type === "clear-undone") {
          disarmClearUndo();
          return;
        }
        if (msg.type === "preview") {
          previewError = !!msg.error;
          if (msg.error) {
            if (msg.revealError) showFormulaError(friendlyError(msg));
            else hideFormulaError();
            return;
          }
          hideFormulaError();
          return;
        }
        if (msg.type === "insert-ref") {
          formulaMode = true;
          const ids = msg.cellIds || [];
          if (ids.length > 0) {
            for (const id of ids) insertRefAtCaret(id);
          } else if (msg.formula) {
            renderTokens(msg.formula);
          }
          requestPreview({ revealError: false });
          keepFormulaFieldFocused();
          return;
        }
        if (msg.type === "keep-formula-focus") {
          keepFormulaFieldFocused();
          return;
        }
        if (msg.type === "canvas-value") {
          if (formulaMode) return;
          if (document.activeElement === exprDraft) return;
          exprDraft.value = msg.rawValue == null ? "" : String(msg.rawValue);
          updateMode();
          return;
        }
        if (msg.type !== "selection") return;
        if (
          formulaFieldBusy() &&
          msg.mode === "cell" &&
          msg.cell &&
          msg.cell.cellId === cellId.value
        ) {
          if (msg.cell.format) setFormat(msg.cell.format);
          return;
        }
        hideFormulaError();
        previewError = false;
        if (msg.mode === "empty" || (!msg.cell && msg.mode !== "format-only")) {
          panel.hidden = true;
          empty.hidden = false;
          return;
        }
        empty.hidden = true;
        panel.hidden = false;
        if (msg.mode === "format-only") {
          setPanelMode("format-only", msg.frameCount);
          setFormat(msg.format);
          hideFormulaError();
          return;
        }
        setPanelMode("cell");
        cellId.value = msg.cell.cellId;
        if (msg.cell.formula) {
          formulaMode = true;
          exprDraft.value = "";
          renderTokens(msg.cell.formula);
          if (msg.cell.error) showFormulaError(friendlyError(msg.cell));
        } else {
          exitFormulaMode();
          exprDraft.value = msg.cell.rawValue == null ? "" : String(msg.cell.rawValue);
          updateMode();
        }
        setFormat(msg.cell.format);
      };

      exprBox.addEventListener("click", (event) => {
        if (event.target.closest(".tag-remove")) return;
        if (event.target === exprBox || event.target === equalsMark) {
          if (formulaMode) setCaret(event.target === equalsMark ? 0 : formulaParts.length);
          else exprDraft.focus();
          return;
        }
        exprDraft.focus();
      });
      clearExpr.addEventListener("mousedown", (event) => {
        event.preventDefault();
        window.clearTimeout(blurTimer);
      });
      clearExpr.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        clearExpression();
      });
      window.addEventListener(
        "keydown",
        (event) => {
          if (!clearUndoArmed) return;
          if (
            (event.metaKey || event.ctrlKey) &&
            event.key.toLowerCase() === "z" &&
            !event.shiftKey
          ) {
            event.preventDefault();
            event.stopPropagation();
            disarmClearUndo();
            post({ type: "undo-clear" });
          }
        },
        true,
      );
      exprDraft.addEventListener("focus", () => {
        window.clearTimeout(blurTimer);
        setFormulaFocus(true);
      });
      exprDraft.addEventListener("blur", () => {
        if (holdFormulaFocus) {
          exprDraft.focus();
          return;
        }
        blurTimer = window.setTimeout(() => {
          if (holdFormulaFocus) {
            exprDraft.focus();
            return;
          }
          setFormulaFocus(false);
          commitFormula();
          window.requestAnimationFrame(resizePlugin);
        }, 400);
      });
      exprDraft.addEventListener("input", () => {
        disarmClearUndo();
        hideFormulaError();
        if (!formulaMode && exprDraft.value.trimStart().startsWith("=")) {
          const rest = exprDraft.value.trimStart().replace(/^=/, "").trimStart();
          exprDraft.value = "";
          renderTokens(rest);
        } else if (formulaMode) {
          consumeLeadingOps();
          commitSpacedDraft();
        }
        updatePlaceholder();
        requestPreview({ revealError: false });
        syncClearButton();
      });
      exprDraft.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
          event.preventDefault();
          commitFormula();
          return;
        }
        if (event.key === "Enter") {
          event.preventDefault();
          return;
        }
        if (formulaMode && !event.metaKey && !event.ctrlKey && /^[+\-*/(),]$/.test(event.key)) {
          event.preventDefault();
          insertTokenAtCaret(event.key);
          requestPreview({ revealError: false });
          exprDraft.focus();
          return;
        }
        if (formulaMode && event.key === " " && !event.metaKey && !event.ctrlKey) {
          const draft = exprDraft.value.trim();
          if (draft) {
            event.preventDefault();
            commitDraftAsTokens(draft);
            requestPreview({ revealError: false });
            exprDraft.focus();
          }
          return;
        }
        if (formulaMode && !exprDraft.value) {
          if (event.key === "ArrowLeft" && caretIndex > 0) {
            event.preventDefault();
            setCaret(caretIndex - 1);
            return;
          }
          if (event.key === "ArrowRight" && caretIndex < formulaParts.length) {
            event.preventDefault();
            setCaret(caretIndex + 1);
            return;
          }
        }
        if (event.key !== "Backspace" || exprDraft.value) {
          return;
        }
        if (!formulaMode) return;
        event.preventDefault();
        if (caretIndex === 0 && formulaParts.length === 0) {
          exitFormulaMode();
          requestPreview({ revealError: false });
          return;
        }
        if (caretIndex === 0) return;
        formulaParts.splice(caretIndex - 1, 1);
        caretIndex -= 1;
        paintTokens();
        requestPreview({ revealError: false });
      });

      kind.addEventListener("change", () => {
        syncAdvancedFormatFields();
        if (kind.value === "currency") moreOptions.open = true;
        scheduleFormatCommit();
      });
      fractionDigits.addEventListener("change", () => {
        scheduleFormatCommit();
      });
      for (const el of [currency, locale]) {
        el.addEventListener("change", () => {
          scheduleFormatCommit();
        });
      }
      cellId.addEventListener("change", () => {
        requestPreview({ revealError: false });
      });

      panel.addEventListener("submit", (event) => {
        event.preventDefault();
        if (formatOnly) {
          post({ type: "apply-format", format: currentFormat() });
        }
      });
      moreOptions.addEventListener("toggle", () => {
        window.requestAnimationFrame(resizePlugin);
      });
      new ResizeObserver(() => {
        window.requestAnimationFrame(resizePlugin);
      }).observe(panel);
      new ResizeObserver(() => {
        window.requestAnimationFrame(resizePlugin);
      }).observe(empty);

      syncAdvancedFormatFields();
      post({ type: "ready" });
    </script>
  </body>
</html>
